name: Docker Image CI (pull request)

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - name: Build Docker Image
      uses: docker/build-push-action@v7
      with:
        push: false
        cache-from: type=gha
