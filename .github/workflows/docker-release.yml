name: Docker Image CI (release)

on:
  release:
    types: [ "published" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Resolve release tag
      id: release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EVENT_TAG: ${{ github.event.release.tag_name }}
      run: |
        tag="${EVENT_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v7
      with:
        ref: ${{ steps.release.outputs.tag }}
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Resolve image name
      id: image
      run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
    - name: Build Docker Image and publish to GHCR
      uses: docker/build-push-action@v7
      with:
        push: true
        pull: true
        no-cache: ${{ github.event_name == 'workflow_dispatch' }}
        tags: |
          ${{ steps.image.outputs.name }}:${{ steps.release.outputs.tag }}
          ${{ steps.image.outputs.name }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Clean up untagged images
      uses: dataaxiom/ghcr-cleanup-action@v1
      with:
        delete-untagged: true
